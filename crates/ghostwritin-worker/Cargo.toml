[package]
name = "ghostwritin-worker"
description = "The open-source Ghostwritin Worker: the API modules on the Cratefield harness for Cloudflare Workers, with the open implementation of every port. Not deployed yet."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
ghostwritin-api = { path = "../ghostwritin-api" }
ghostwritin-core = { path = "../ghostwritin-core" }
cratefield-core = { workspace = true }
cratefield-runtime-cloudflare = { workspace = true }
cratefield-adapter-anthropic = { workspace = true }
cratefield-adapter-openai-compatible = { workspace = true }
serde_json = { workspace = true }
worker = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true }
