# The open-source Ghostwritin Worker. The configuration is ready to deploy;
# the deploy has not been run yet — nothing here serves api.ghostwrit.in
# (see the "Deploy the Worker" issue). Deploy with `tools/deploy.sh staging`
# or `tools/deploy.sh production`; a self-hosted account uses the same two.
name = "ghostwritin-api"
main = "build/worker/shim.mjs"
compatibility_date = "2026-09-01"
# Staging is served on a custom domain in the Factory0 account, so no
# workers.dev subdomain is registered for the account (a non-interactive
# deploy would otherwise register one on its own).
workers_dev = false
routes = [{ pattern = "staging-api.ghostwrit.in", custom_domain = true }]

[build]
command = "worker-build --release"

# No [observability] block on purpose: Workers Logs would also capture the
# runtime's own request logs. The Worker logs one metadata-only line per
# rewrite (log_outcome in ghostwritin-api); request bodies are never logged.

[vars]
ENV = "staging"
# Optional: the model the tier maps to (defaults are the adapters' own).
# ANTHROPIC_MODEL = ""
# OPENAI_MODEL = ""
# OPENAI_BASE_URL = ""

# The throttle in front of `POST /v1/rewrite`: 10 rewrites a minute per key
# (the hash of the caller's bearer token, else their connecting IP). One
# rewrite fans out into several model calls, so a burst must be made to
# queue rather than fan out with it; 60 s is the longest period a Workers
# rate-limit binding offers, so clients get `Retry-After: 60`.
[[ratelimits]]
name = "REWRITE_LIMITER"
namespace_id = "5001"
simple = { limit = 10, period = 60 }

# Secrets, never in this file (`wrangler secret put <NAME>`, or
# `tools/deploy.sh` refuses to deploy):
#   GHOSTWRITIN_API_KEYS   account=sha256hex pairs, comma-separated; without
#                          it every rewrite is refused (401)
#   ANTHROPIC_API_KEY      or OPENAI_API_KEY: the model provider; without one
#                          /v1/rewrite answers 503 model-not-configured
#   HARNESS_SECRET         harness log pseudonyms (32+ bytes)

# Production, on the custom domain. An [env.*] block inherits nothing:
# vars and bindings are repeated below, and the limiter gets its own
# namespace_id so a burst against staging cannot spend production's
# (namespaces are account-wide). The ids 5001 and 5002 are unused on the
# Factory0 account; 1001 and 1002 are taken by other Workers' limiters.
# Deployed as `ghostwritin-api-production` (wrangler appends the environment
# to the name).
[env.production]
routes = [{ pattern = "api.ghostwrit.in", custom_domain = true }]
workers_dev = false

[env.production.vars]
ENV = "production"

[[env.production.ratelimits]]
name = "REWRITE_LIMITER"
namespace_id = "5002"
simple = { limit = 10, period = 60 }

# The same secrets, per environment (`--env production` for this one):
#   wrangler secret put GHOSTWRITIN_API_KEYS [--env production]
#   wrangler secret put ANTHROPIC_API_KEY [--env production]
#   wrangler secret put HARNESS_SECRET [--env production]
