name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # rust-toolchain.toml pins the channel, components and the wasm target.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: doc
        run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings
      # The Worker must keep building for Workers: a native-only dependency
      # in the engine or the API would only show up here.
      - name: worker builds for wasm32
        run: cargo build --target wasm32-unknown-unknown -p ghostwritin-worker
