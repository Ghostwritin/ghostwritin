[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/Ghostwritin/ghostwritin"
# Open source, but not on crates.io yet: the crate names are not claimed.
publish = false

[workspace.dependencies]
# The Cratefield harness, from crates.io, as the other Factory Zero ventures use it.
cratefield-core = "0.8.4"
cratefield-runtime-cloudflare = "0.4.2"
cratefield-adapter-anthropic = "0.3.1"
cratefield-adapter-openai-compatible = "0.2.1"
cratefield-testing = "0.5.1"
# RFC 3339 reset times (`resets_at` on a 429).
time = { version = "0.3.45", default-features = false, features = ["std", "formatting"] }
# The meaning lock and the word diff are generic, so they live in the harness
# (Cratefield/harness#836, PR #837). Not released yet: a git dependency pinned
# to the PR's head commit. Neither crate depends on cratefield-core, so no
# `[patch]` is needed. Repin to crates.io once released (#9).
cratefield-text-guard = { git = "https://github.com/Cratefield/harness", rev = "c12f3954d7febde9e3786db2651a825f2750eb14" }
cratefield-text-diff = { git = "https://github.com/Cratefield/harness", rev = "c12f3954d7febde9e3786db2651a825f2750eb14" }
# Versions follow the harness workspace so one lockfile resolves both.
async-trait = "0.1.92"
axum = { version = "0.8.9", default-features = false, features = ["json"] }
bytes = "1.12.1"
getrandom = { version = "0.4.3", default-features = false, features = ["wasm_js"] }
http = "1.5.0"
pollster = { version = "0.4", features = ["macro"] }
schemars = { version = "1.2.2", features = ["preserve_order"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
subtle = "2.6.1"
sha2 = "0.11.0"
thiserror = "2.0.20"
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
worker = { version = "0.8.5", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
unnameable_types = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
must_use_candidate = { level = "allow", priority = 1 }

[profile.release]
opt-level = "s"
lto = true
